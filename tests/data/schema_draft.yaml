RHEEDMeasurement (inherits Measurement):
  measurement_id: string
  mbe_experiment_ref: reference --> to ExperimentMbePDI (rather than to GrowthMbePDI which is not completely functional, yet), i.e., growth run ID of the experiment e.g., m84123  
  datetime_start: datetime?
  datetime_end: datetime?
  operator: string?                  # optional (or rely on NOMAD authors)
  instruments: [InstrumentReference] # base Measurement field (include used instrument entry)
  sample: reference to sample , default is the sample in the center of the sample holder, can be pulled from the Experiment class which i s in the filledsubstaterholder --- perhaps define furhter down ...
# begin inserted by Oliver #
  measurement_settings:
    chamber_geometry:
      distance_sample_to_screen_mm: float
    camera:
      image_length_calibration_mm_per_px: float

    e-gun_STAIB:
      electron_energy_keV: float
      emission_current_uA: float
      filament_current_A: float
      
    e-gun_FUG:
      electron_energy_keV: float
      emission_current_uA: float
      filament_current_A: float
      filament_voltage_V: float
      grid_voltage_V: float
      topaz_voltage_V: float
      
    deflection_unit_STAIB:
      grid: float                      # unit not specified
      focus: float                     # unit not specified
      beam_deflection_x: float         # unit not specified
      beam_deflection_y: float         # unit not specified
      beam_rocking: float              # unit not specified

    deflection_unit_FUG:
      alignment_x: float
      alignment_y: float
      magnet_lens: float
      x_or_y_scan: x or y
      ext_or_int_ref: ext or int
      beam_deflection_x_coarse: float         # unit not specified
      beam_deflection_x_fine: float         # unit not specified
      beam_deflection_x_crosspoint: float         # unit not specified
      beam_deflection_x_angle: float         # unit not specified, corresponds to beam rocking
      beam_deflection_y_coarse: float         # unit not specified
      beam_deflection_y_fine: float         # unit not specified
      beam_deflection_y_crosspoint: float         # unit not specified
      beam_deflection_y_angle: float         # unit not specified
      
    compensation_cage_on: bool
    incidence_angle_deg: float?

    substrate_holder:
      rotation_angle: float          #deg
      position_measured: string      # to be matched to position name of the used holder which can be pulled from the MBEExperiment
    sample: 
      sample_reference: reference to sample    # can be derived from position_measured and MBEExperiment sample ID = MBEExperimentID_PositionNameOnHolder
      sample_id: string # pulled from sample reference
      sample_azimuth_phi_deg: float # rheed beam direction relative to specified reference direction on substrate,   user adds this manually, not derived from the video
      sample_azimuth_uvw: u v w  # 3 integers indexing real space direction,   user adds this manually, not derived from the video
      sample_azimuth_hkl: h k l  # 3 integers indexing reciprocal space direction,   user adds this manually, not derived from the video
      
 # end inserted by oliver      
  results:                           # repeatable
    - RHEEDResult (inherits MeasurementResult):
        result_type: video|image|scan_point
        #datetime: datetime?
        sample_azimuth_phi_deg: float? user adds this manually, not derived from the video
        sample_rotation_alpha_deg: float? manually measured or inserted by the user, not derived from the video
        notes: string?

    - RHEEDVideoResult (RHEEDResult):
        video_link: url
        
    - RHEEDImageResult (RHEEDResult):
        images: [file, ...]
        derived_from_video_link: url?
        timestamp:
        sample:

    - RHEEDPointScanResult (RHEEDResult):
        point_scans: [PointScan, ...]
        start_time:
        end_time:

PointScan:
  source_file: file                  # .asc and/or .csv
  start_time: datetime?
  end_time: datetime?
  sensor_position_overview_picture: file?
  derived_from_video_link: url?
  sensors:
    - name: string
      position_label: string?
      time: array
      intensity: array
